name: Android CI

# 出包走 android/build_apk.sh（aapt2 + javac + d8 + zipalign + apksigner），
# 与 README「三分钟跑起来」同一条路径；gradle 脚手架这一版不参与出包。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它会先跑 `sdkmanager tools`，
      # 而 runner 镜像的 cmdline-tools 16 已经下架了 `tools` 包，直接 exit 1。
      # ubuntu-latest 自带 Android SDK，这里只补装需要的组件。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0"

      - name: 出包
        working-directory: android
        run: |
          chmod +x build_apk.sh
          bash build_apk.sh

      - name: 校验签名与版本
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs android/build/diting.apk
          "$BT/aapt2" dump badging android/build/diting.apk | head -1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: diting-apk
          path: android/build/diting.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diting-apk
          path: dist

      - name: 附件挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 谛听 ${{ github.ref_name }}
          body: |
            ## 谛听 ${{ github.ref_name }} — 比赛版本

            安卓安装包见下方 Assets：`diting.apk`（`com.diting.app`，`minSdk 26` / `targetSdk 34`，约 214 KB，`debug.keystore` 签名，仅供自用试用）。

            **装法**

            1. 手机上允许「安装未知来源应用」，安装 `diting.apk`。
            2. 打开 App → 设置：填云端地址（默认 `112.124.111.67:19002`）和 DeepSeek 的 Key。
            3. 小米 / 红米报 `INSTALL_FAILED_USER_RESTRICTED` 时：`adb install -r -i com.android.vending diting.apk`。

            这个包由 CI 跑 `android/build_apk.sh` 从本 tag 的源码出包，出包后校验了签名与版本号。
            没有板子时左栏会一直空着——这一版声音只从挂坠来。已知局限见 README。
          files: dist/diting.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
